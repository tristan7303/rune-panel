# Build and publish a Windows installer.
#
# Triggered by pushing a tag like `v0.1.0`. electron-builder uploads to a
# *draft* GitHub Release, so a bad build can be discarded before anyone's
# updater sees it — publishing the draft is what actually ships it.
#
# This file is public, like every workflow in a public repository, and that is
# fine — but three properties keep it that way and are easy to undo by accident:
#
#  1. No `pull_request` or `pull_request_target` trigger. Both triggers below
#     require write access to this repository, so nobody outside it can start a
#     run. `pull_request_target` in particular hands repository secrets to code
#     from a fork and is the classic way a public workflow gets compromised.
#  2. Secrets are scoped to the step that needs them, not the workflow. `npm ci`
#     runs dependency install scripts; it must not do so with a signing
#     certificate and a token in its environment.
#  3. Only first-party `actions/*` steps. A third-party action runs arbitrary
#     code with whatever the job can reach.
name: Release

on:
  push:
    tags: ['v*']
  # Also runnable by hand, for testing the pipeline without cutting a tag.
  # Requires write access, so this is not a way in for anyone else.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The setup-shell hook needs cargo, and the hosted Windows images have
      # dropped and re-added Rust over the years. Installed by hand from
      # rustup rather than a third-party action, per the rules above.
      - name: Ensure Rust toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --profile minimal --default-toolchain stable
            Remove-Item rustup-init.exe
            Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
            $env:Path += ";$env:USERPROFILE\.cargo\bin"
          }
          cargo --version

      - name: Build and publish
        run: npm run release
        env:
          # Provided by Actions; electron-builder uses it to create the draft.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing, if a certificate is ever configured. Unset means unsigned.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # The branded installer, built by the afterAllArtifactBuild hook during
      # the step above. Uploaded here with `gh` (preinstalled, first-party)
      # rather than returned to electron-builder's publisher: its http client
      # times out on parallel 100 MB uploads, which is exactly what two
      # installers are. Retries because a single big upload can still hiccup.
      - name: Attach branded installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          $exe = "release/RunePanel-Installer-$v.exe"
          if (-not (Test-Path $exe)) { Write-Error "missing $exe"; exit 1 }
          foreach ($try in 1..5) {
            gh release upload "v$v" $exe --clobber -R ${{ github.repository }}
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "upload attempt $try failed; retrying"
            Start-Sleep -Seconds (15 * $try)
          }
          exit 1
