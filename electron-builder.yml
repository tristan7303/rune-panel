# Packaging.
#
# electron-vite emits to out/; this wraps that plus the runtime dependencies
# into an installer. Everything else in the repo — sources, the smoke suite,
# artwork — is excluded, so the shipped app carries only what it runs.

appId: org.runepanel.app
productName: Rune Panel
copyright: Rune Panel. Not affiliated with Jagex or the OSRS Wiki.

directories:
  output: release
  buildResources: build

# No spaces. The default is "${productName} Setup ${version}.exe", which lands
# on disk with spaces while the update feed refers to the URL-encoded form —
# two names for one file is a needless way for an update to 404.
artifactName: RunePanel-Setup-${version}.${ext}

# out/ is the built app. `resources/` holds the icon the tray and window load at
# runtime, and has to travel as an extra resource because it is read from
# `process.resourcesPath` rather than bundled.
files:
  - out/**/*
  - package.json

extraResources:
  - from: resources
    to: .
    filter:
      - '**/*'

# Pure-JS dependencies. Nothing here is native — `node:sqlite` is a Node
# builtin, which is the whole reason the database needed no rebuild step.
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  # Signing is wired but unset. electron-builder reads these from the
  # environment, so supplying a certificate later needs no code change:
  #   CSC_LINK           path or base64 of a .pfx
  #   CSC_KEY_PASSWORD   its password
  # Until then builds are unsigned and Windows SmartScreen will warn once.
  signAndEditExecutable: true
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  perMachine: false
  # No directory page: Rune Panel installs under the user's own AppData, needs no
  # elevation, and the one custom page states where it is going. A wizard step
  # whose answer is almost always "yes, the default" is a step for its own sake.
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Rune Panel

  # The wizard's own artwork. Both are generated from images/rune-panel-logo.png
  # by scripts/installer-art.mjs and committed, because the build consumes them
  # — regenerate with `npx electron scripts/installer-art.mjs` if the logo
  # changes. NSIS fixes both sizes and the format: 164x314 for the panel beside
  # the welcome and finish pages, 150x57 for the badge in the header of the
  # pages between them, 24-bit BMP for each.
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp

  # Colours and wording. See the file — the short version is that the welcome
  # and finish pages are ours to paint and the ones in between are Windows'.
  include: build/installer.nsh
  # Keep the user's cache and settings on uninstall — they live in
  # %APPDATA%/rune-panel and are expensive to rebuild (the title index alone is
  # a four-minute download).
  deleteAppDataOnUninstall: false

# Builds the branded setup shell (installer/) with the NSIS exe embedded and
# publishes it alongside. Needs a Rust toolchain; the GitHub runners have one.
afterAllArtifactBuild: scripts/attach-setup-shell.js

publish:
  provider: github
  owner: tristan7303
  repo: rune-panel
  # Releases are drafted rather than published outright, so a bad build can be
  # discarded before anyone's updater sees it.
  releaseType: draft

# Written into every release automatically.
#
# A release page shows several files and only one of them is for a person: the
# branded installer. `RunePanel-Setup` is the raw NSIS engine the in-app
# updater downloads and runs silently, `latest.yml` is the update feed it
# reads, and the two source archives are attached by GitHub whether we like it
# or not. None of that can be bundled into a single zip — electron-updater
# fetches `latest.yml` and then the setup exe as separate URLs, so zipping
# them breaks updates for everyone — which leaves saying plainly which file to
# click.
releaseInfo:
  releaseNotes: |
    ### Download

    Grab the **`RunePanel-Installer-….exe`** below. That is the only file you
    need. Run it.

    Windows will say *"Windows protected your PC"* because the installer is not
    code-signed. Click **More info** → **Run anyway**. Only happens once;
    updates after this are handled inside the app.

    The other files are not for you: `RunePanel-Setup-….exe` and `latest.yml`
    are how Rune Panel updates itself, and the two source archives are added by
    GitHub automatically.

    ### First launch

    Rune Panel asks to download the wiki's page list — about four minutes, with
    a progress bar. Nothing works properly until it finishes.
